<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <link rel="stylesheet" href="Formulario.css">
    <link rel="icon" href="IMG/ICONO - Valles de arauco.jpg">
    <title>Formulario de contacto</title>
</head>
<body>



    <!--Seccion general de Formulario-->

    <section class="PageContactanos">
        <h4 class="TituloFormulario">DEJANOS TU MENSAJE</h4>
            <form action="Formulario">
                <p class="InicioFormulario">No dudes en contactarnos en cualquier momento. <br> Le responderemos a la brevedad! </p>


                <!--Inicio Formulario-->
                <div class="ContenedorFormulario">
                    <div class="DescripcionFormulario">
                        <input type="text" id="CorreoElectronico" class="inputCorreoElectronico" placeholder=" ">
                        <label for="CorreoElectronico" class="labelCorreoElectronico">Correo Electronico</label>
                        <span class="spanCorreoElectronico"></span>
                    </div>

                    <div class="DescripcionFormulario">
                        <input type="text" id="NombreyApellido" class="inputNombreyApellido" placeholder=" ">
                        <label for="NombreyApellido" class="labelNombreyApellido">Nombre y Apellido</label>
                        <span class="spanNombreyApellido"></span>
                    </div>

                    <div class="DescripcionFormulario">
                        <input type="text" id="Ciudad" class="inputCiudad" placeholder=" ">
                        <label for="Ciudad" class="labelCiudad">Ciudad</label>
                        <span class="spanCiudad"></span>
                    </div>

                    <div class="DescripcionFormulario">
                        <input type="text" id="Provincia" class="inputProvincia" placeholder=" ">
                        <label for="Provincia" class="labelProvincia">Provincia</label>
                        <span class="spanProvincia"></span>
                    </div>

                    <div class="DescripcionFormulario">
                        <input type="text" id="Telefono" class="inputTelefono" placeholder=" ">
                        <label for="Telefono" class="labelTelefono">Telefono</label>
                        <span class="spanTelefono"></span>
                    </div>

                    <div class="DescripcionFormulario">
                        <input type="text" id="Mensaje" class="inputMensaje" placeholder=" ">
                        <label for="Mensaje" class="labelMensaje">Mensaje</label>
                        <span class="spanMensaje"></span>
                    </div>

                    <input type="submit" name="Enviar" id="Enviar">
                </div>
            </form>
    </section>    
</body>
</html>
